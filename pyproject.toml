[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-edge-runtime-profiler"
version = "0.1.0"
description = "Catch YOLO tail latency, stage imbalance, and postprocess spikes from Ultralytics Results.speed."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "ZC502"}
]
keywords = ["yolo", "ultralytics", "edge-ai", "profiler", "latency", "runtime", "computer-vision"]
dependencies = [
  "numpy>=1.23"
]

[project.optional-dependencies]
examples = [
  "ultralytics>=8.0.0",
  "opencv-python>=4.8.0"
]
plots = [
  "matplotlib>=3.7.0"
]

[project.scripts]
yolo-edge-profile = "yolo_edge_runtime_profiler.cli:main"

[tool.setuptools.packages.find]
include = ["yolo_edge_runtime_profiler*"]
